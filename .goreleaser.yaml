# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: hashdog

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  - id: hashdog
    main: .
    binary: hashdog
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - contrib/hashdog.service

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Keyless cosign signature over the checksum file (OIDC identity of the release
# workflow). Verify with the command in README.md. Skipped for snapshot builds.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    output: true
    args:
      - sign-blob
      - --yes
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - ${artifact}

nfpms:
  - id: packages
    package_name: hashdog
    formats: [deb, rpm]
    maintainer: Dakoda Stemen
    homepage: https://github.com/DakodaStemen/Hashdog
    description: Merkle-tree file integrity monitor with signed baselines
    license: MIT
    contents:
      - src: contrib/hashdog.service
        dst: /usr/share/doc/hashdog/hashdog.service

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^chore:", "^test:"]

release:
  draft: false
  prerelease: auto
