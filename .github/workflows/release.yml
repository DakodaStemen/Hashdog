name: Release

# Runs only when a version tag is pushed. Nothing here fires on PRs or main.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub release and upload assets
  id-token: write   # keyless cosign signing (OIDC)

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # goreleaser needs tags for the changelog
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test before releasing
        run: go vet ./... && go test -race -count=1 ./...
      - uses: sigstore/cosign-installer@v3
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
